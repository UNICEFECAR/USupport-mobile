// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = 36
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        // Versions required by React Native 0.81 / Expo SDK 54
        // (see @react-native/gradle-plugin/gradle/libs.versions.toml).
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'
        gradlePluginVersion = '8.11.0'

        // NDK r27 is the first version that can emit 16 KB-aligned ELF segments, via the
        // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES switch injected into every subproject below.
        // (r28+ makes 16 KB the default and the switch becomes unnecessary.)
        ndkVersion = "27.1.12297006"
    }

    subprojects { subproject ->
        afterEvaluate{
            if((subproject.plugins.hasPlugin('android') || subproject.plugins.hasPlugin('android-library'))) {
                android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion

                    // Google Play requires 16 KB page size support for apps targeting Android 15+.
                    // Every module that compiles native code from source must link its .so with
                    // 16 KB-aligned LOAD segments; this switch does that for CMake-based modules
                    // (expo-modules-core, expo-av, reanimated, worklets, rnscreens, ...).
                    // Modules with no native build simply ignore it.
                    defaultConfig {
                        externalNativeBuild {
                            cmake {
                                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                            }
                            ndkBuild {
                                arguments "APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true"
                            }
                        }
                    }
                }
            }
        }
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradlePluginVersion"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath('de.undercouch:gradle-download-task:5.0.1')
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

def REACT_NATIVE_VERSION = new File(['node', '--print', "JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

apply plugin: "com.facebook.react.rootproject"


allprojects {
    configurations.all {
        resolutionStrategy {
            force "com.facebook.react:react-native:" + REACT_NATIVE_VERSION

            // 16 KB page size support (Google Play requirement for apps targeting Android 15+).
            // expo-camera pulls barcode-scanning 17.2.0, whose libbarhopper_v3.so is 4 KB-aligned;
            // 17.3.0 is 16 KB-aligned.
            force "com.google.mlkit:barcode-scanning:17.3.0"

            // Deliberately NOT forced here, because forcing them cannot work today:
            //  * fbjni 0.7.0 does ship 16 KB libfbjni.so/libc++_shared.so, but react-android
            //    0.76.9 bundles its own 4 KB copies of both and wins the native-library merge.
            //  * Fresco's 16 KB releases (libanimation-decoder-gif.so, libavif_android.so) need
            //    kotlin-stdlib 2.x, unreadable by the Kotlin 1.9.24 compiler this project pins
            //    for expo-modules-core's Compose compiler.
            // Both resolve with the React Native 0.77+ / Expo SDK upgrade, which is also the only
            // fix for libhermes / libhermestooling / libjsi / libreactnative.
        }
    }

    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        maven {
          url "$rootDir/../node_modules/expo-camera/android/maven"
        }

        google()
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup 'com.facebook.react'
            }
        }
        maven { url 'https://www.jitpack.io' }
    }
}
